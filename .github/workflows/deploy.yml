name: 'Deploy Ecostore to Cloud Run'

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: 'ecostore-514711'
  REGION: 'us-central1'
  SERVICE_NAME: 'ecostore-app'

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  deploy:
    name: 'Build and Deploy from Source'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: 'github-deployer@ecostore-514711.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Source to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --labels=managed-by=github-actions
